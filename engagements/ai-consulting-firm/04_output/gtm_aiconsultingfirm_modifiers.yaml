  seniority:
    description: Seniority tier normalization for C_SENIORITY.
    source: LinkedIn Sales Navigator seniority filters (linkedin.com/sales/search);
      ZoomInfo job-function taxonomy (developer.zoominfo.com)
    tiers:
    - description: Individual contributor — no direct reports
      example_titles:
      - Account Executive
      - Software Engineer
      - Data Analyst
      - SDR
      - BDR
      - Marketing Analyst
      value: ic
    - description: Manages a team, typically 2-10 reports
      example_titles:
      - Sales Manager
      - Engineering Manager
      - Marketing Manager
      - Revenue Operations Manager
      value: manager
    - description: Manages managers or a department
      example_titles:
      - Director of Sales
      - Director of Engineering
      - Director of Marketing
      - Director of Revenue Operations
      value: director
    - description: VP or SVP level
      example_titles:
      - VP of Sales
      - VP of Engineering
      - SVP of Marketing
      - VP of Revenue
      - VP of Customer Success
      value: vp
    - description: C-level executive
      example_titles:
      - CEO
      - CTO
      - CFO
      - COO
      - CMO
      - CRO
      - CPO
      - CISO
      value: c_suite
    - description: Founder or co-founder (may overlap with c_suite)
      example_titles:
      - Founder
      - Co-Founder
      - Founding Engineer
      - Founding AE
      value: founder
qualification:
  confidence_thresholds:
    auto_disqualify_below: 0.5
    auto_qualify_above: 0.85
    description: Confidence thresholds for HIL routing. Override during benchmark
      call.
    hil_between:
    - 0.5
    - 0.85
    source: Platt calibration methodology; internal schema-forge default
  disposition_policy:
    description: Evidence-to-disposition mapping. See policy.py for the code implementation.
    disposition_values:
    - qualified
    - nurture
    - disqualified
    evidence_labels:
    - Q_BUDGET_CONFIRMED
    - Q_AUTHORITY_IDENTIFIED
    - Q_NEED_ARTICULATED
    - Q_TIMELINE_STATED
    framework: MEDDPICC
    source: MEDDPICC qualification framework (public; multiple structured versions
      on github.com and notion.so); Clari published qualification rubrics (clari.com/blog)
signal:
  competitor_mentions:
    common_competitive_segments:
    - CRM competitors
    - sales engagement competitors
    - enrichment data competitors
    - BI/analytics competitors
    - marketing automation competitors
    description: Competitor name modifiers for S_COMPETITOR_MENTION normalization.
    note: Buyer-specific competitor list populated during benchmark call.
    source: G2 competitive categories (g2.com/compare); Gartner Magic Quadrant public
      reports; Forrester Wave reports
  funding_triggers:
    description: Funding event modifiers for S_FUNDING_TRIGGER.
    high_intent_events:
    - raised Series A
    - raised Series B
    - raised Series C
    - raised growth equity
    - raised venture debt
    - completed IPO
    - SPAC merger closed
    - acquired by strategic
    source: Crunchbase funding announcements (crunchbase.com); PitchBook event taxonomy;
      PredictLeads funding signals
    timing_indicators:
    - within last 30 days
    - within last 90 days
    - within last 6 months
  hiring_signals:
