account:
  employee_range:
    buckets:
    - label: micro
      value: 1-10
    - label: small
      value: 11-50
    - label: growth
      value: 51-200
    - label: mid_market
      value: 201-1000
    - label: enterprise_lower
      value: 1001-5000
    - label: enterprise_upper
      value: 5000+
    description: Standard headcount buckets for A_EMPLOYEE_RANGE normalization.
    source: Salesforce lead-scoring standard (trailhead.salesforce.com); HubSpot company
      size buckets (knowledge.hubspot.com)
  funding_stage:
    description: Funding stage normalization for A_FUNDING_STAGE.
    source: Crunchbase funding stage taxonomy (crunchbase.com/discover/funding_rounds);
      PitchBook stage definitions
    stages:
    - description: No external institutional funding
      value: bootstrapped
    - description: Friends/family or angel round, typically <$1M
      value: pre_seed
    - description: Seed round, typically $1M-$4M
      value: seed
    - description: Series A, typically $5M-$20M
      value: series_a
    - description: Series B, typically $20M-$60M
      value: series_b
    - description: Series C, typically $60M-$200M
      value: series_c
    - description: Series D or later
      value: series_d_plus
    - description: Listed on public exchange (NYSE, NASDAQ, LSE, etc.)
      value: public
    - description: Acquired by another entity
      value: acquired
  industry:
